name: Build and Publish

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: write
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Check TypeScript compilation
        run: npx tsc --noEmit

      # Run smoke tests if valid configuration is available
      - name: Check for valid configuration
        id: config-check
        run: |
          if [ -n "${SONARR_URL}" ] && [ -n "${SONARR_API_KEY}" ]; then
            echo "has_real_config=true" >> $GITHUB_OUTPUT
            echo "✅ Found SONARR_URL and SONARR_API_KEY - running smoke tests"
          elif [ -n "${FLIX_BRIDGE_ENV_MAPPING}" ]; then
            echo "has_real_config=true" >> $GITHUB_OUTPUT
            echo "✅ Found FLIX_BRIDGE_ENV_MAPPING - running smoke tests"
          else
            echo "has_real_config=false" >> $GITHUB_OUTPUT
            echo "⚠️ No environment configuration detected - skipping smoke tests"
          fi

      - name: Run smoke tests
        if: steps.config-check.outputs.has_real_config == 'true'
        run: npm run smoke
        env:
          FLIX_BRIDGE_DEBUG: 1

      - name: Validate build artifacts
        run: |
          echo "✅ Validating build artifacts..."
          if [ ! -f dist/index.js ]; then
            echo "❌ Main entry point missing: dist/index.js"
            exit 1
          fi
          if [ ! -d dist/services ]; then
            echo "❌ Services directory missing: dist/services"
            exit 1
          fi
          echo "✅ All required build artifacts present"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  publish:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.publish-check.outputs.published }}
      version: ${{ steps.version.outputs.new_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Fix executable permissions
        run: chmod +x dist/index.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet HEAD~1 HEAD -- . ':!package-lock.json'; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine version bump type
        id: version-bump
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Check commit messages since last tag to determine version bump
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMIT_MESSAGES=$(git log $LAST_TAG..HEAD --pretty=format:"%s" || git log --pretty=format:"%s")

          if echo "$COMMIT_MESSAGES" | grep -qiE "(breaking|BREAKING|major)"; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MESSAGES" | grep -qiE "(feat|feature|minor)"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: version
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          BUMP_TYPE="${{ steps.version-bump.outputs.bump }}"
          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${NEW_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version_number }}"
          DATE=$(date +%Y-%m-%d)

          # Create or update CHANGELOG.md
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          # Create a temporary file for the new changelog
          echo "# Changelog" > CHANGELOG.tmp
          echo "" >> CHANGELOG.tmp
          echo "## [$VERSION] - $DATE" >> CHANGELOG.tmp
          echo "" >> CHANGELOG.tmp

          # Add commit messages since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s" --reverse)
          else
            COMMITS=$(git log --pretty=format:"- %s" --reverse)
          fi

          if [ -n "$COMMITS" ]; then
            echo "$COMMITS" >> CHANGELOG.tmp
            echo "" >> CHANGELOG.tmp
          fi

          # Append the rest of the existing changelog (skip first 2 lines if they exist)
          if [ -f CHANGELOG.md ] && [ $(wc -l < CHANGELOG.md) -gt 2 ]; then
            tail -n +3 CHANGELOG.md >> CHANGELOG.tmp
          fi

          # Replace the original changelog
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit version bump and changelog
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git tag ${{ steps.version.outputs.new_version }}

      - name: Publish to npm
        id: npm-publish
        if: steps.changes.outputs.has_changes == 'true'
        run: npm publish --provenance --access public
        continue-on-error: true

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true' && steps.npm-publish.outcome == 'success'
        run: |
          git push origin main
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Set publish output
        id: publish-check
        run: |
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ] && [ "${{ steps.npm-publish.outcome }}" == "success" ]; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail with publish guidance
        if: steps.changes.outputs.has_changes == 'true' && steps.npm-publish.outcome != 'success'
        run: |
          echo "npm publish failed."
          echo "If using trusted publishing, configure npm Trusted Publisher for this repo/workflow."
          echo "If using token-based publishing, verify token scope and package permissions."
          exit 1

      - name: Create GitHub Release
        if: steps.changes.outputs.has_changes == 'true' && steps.npm-publish.outcome == 'success'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          body: |
            ## Changes in ${{ steps.version.outputs.new_version }}

            This release was automatically generated from the latest commits to main.

            ### What's Changed
            See the [CHANGELOG.md](https://github.com/thesammykins/FlixBridge/blob/main/CHANGELOG.md) for detailed changes.

            ### NPM Package
            ```bash
            npm install @thesammykins/flixbridge@${{ steps.version.outputs.version_number }}
            ```

            **Full Changelog**: https://github.com/thesammykins/FlixBridge/compare/v${{ steps.version.outputs.version_number }}...${{ steps.version.outputs.new_version }}
          draft: false
          prerelease: false

  notify-discord:
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.publish.outputs.published == 'true'
    steps:
      - name: Send Discord notification
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\"🚀 **New release published!**\\n\\n📦 **@thesammykins/flixbridge** v${{ needs.publish.outputs.version }}\\n\\n✅ Successfully built and published to npm\\n🔗 [View on GitHub](https://github.com/thesammykins/FlixBridge/releases/latest)\\n📋 [View on npm](https://www.npmjs.com/package/@thesammykins/flixbridge)\"}" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || echo "Discord notification failed (webhook not configured)"
