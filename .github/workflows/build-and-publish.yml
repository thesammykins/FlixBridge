name: Verify

# Publication is intentionally absent. A separate reviewed release gate and
# final artifact approval are required before adding any publishing workflow.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Check formatting and lint
        run: npm run check
      - name: Build
        run: npm run build
      - name: Run offline tests
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm audit --audit-level=moderate
